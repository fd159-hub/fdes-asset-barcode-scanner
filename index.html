function hasLib() {
  if (typeof ZXingBrowser === 'undefined') {
    $('cameraError').textContent = '辨識程式未載入，請檢查網路後重新整理網頁。';
    return false;
  }
  return true;
}
function makeReader() {
  return new ZXingBrowser.BrowserMultiFormatOneDReader(new Map([[TRY_HARDER, true]]), {
    delayBetweenScanAttempts: 160, delayBetweenScanSuccess: 650, tryPlayVideoTimeout: 10000
  });
}
const formatNames = ['AZTEC','CODABAR','CODE 39','CODE 93','CODE 128','DATA MATRIX','EAN 8','EAN 13','ITF','MAXICODE','PDF 417','QR CODE','RSS 14','RSS EXPANDED','UPC A','UPC E','UPC EAN EXTENSION'];
function showDecoded(result, source) {
  const raw = result.getText(), now = Date.now();
  if (source === '相機掃描' && raw === lastDecodedRaw) return;
  lastDecodedAt = now; lastDecodedRaw = raw;
  present(raw, formatNames[result.getBarcodeFormat()] || '未知格式', source);
  $('quickResult').hidden = false;
  $('quickResult').textContent = '✓ 已讀取條碼：\n' + raw + '\n' + (formatNames[result.getBarcodeFormat()] || '未知格式') + '｜' + source;
  scannerNotice('✓ 已讀取條碼', 'ok');
  beep();
  $('cameraError').textContent = '✓ 已讀取條碼';
}
function setBusy(value) {
  busy = value;
  $('startBtn').disabled = value || running;
  $('stopBtn').disabled = value || !running;
  $('fileBtn').disabled = value;
  $('cameraSelect').disabled = value || running;
}
async function stop() {
  clearInterval(heartbeat); heartbeat = null;
  const current = controls; controls = null; running = false;
  try { if (current) await current.stop(); } catch (e) { console.warn(e); }
  // Always release the stream, including a failed or interrupted decoder.
  if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
  video.srcObject = null;
  $('zoomControls').hidden = true;
  setBusy(false);
}
async function listCameras() {
  try {
    const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const actualId = video.srcObject?.getVideoTracks()[0]?.getSettings().deviceId;
    let saved = ''; try { saved = localStorage.getItem('fdes_asset_camera_v01') || ''; } catch {}
    const selected = $('cameraSelect').value || saved || devices.find(d => /ultra|超廣|超广/i.test(d.label))?.deviceId || '';
    const auto = document.createElement('option'); auto.value = ''; auto.textContent = '自動選擇後置相機';
    $('cameraSelect').replaceChildren(auto);
    devices.forEach((d, i) => {
      const option = document.createElement('option'); option.value = d.deviceId;
      option.textContent = d.label || '相機 ' + (i + 1); $('cameraSelect').append(option);
    });
    const preferred = actualId || selected;
    $('cameraSelect').value = devices.some(d => d.deviceId === preferred) ? preferred : '';
    if (actualId) { try { localStorage.setItem('fdes_asset_camera_v01', actualId); } catch {} }
  } catch (e) { console.warn(e); }
}
async function configureTrack() {
  const track = video.srcObject?.getVideoTracks()[0];
  if (!track) return;
  const caps = track.getCapabilities?.() || {};
  if (caps.zoom && caps.zoom.max > caps.zoom.min) {
    const zoom = $('zoom');
    zoom.min = caps.zoom.min; zoom.max = Math.min(caps.zoom.max, Math.max(3, caps.zoom.min));
    zoom.step = caps.zoom.step || 0.1;
    zoom.value = track.getSettings().zoom || caps.zoom.min;
    $('zoomControls').hidden = false;
  }
}
$('zoom').oninput = async () => {
  const track = video.srcObject?.getVideoTracks()[0];
  if (!track) return;
  try { await track.applyConstraints({advanced: [{zoom: Number($('zoom').value)}]}); }
  catch { $('cameraError').textContent = '這個鏡頭不支援調整倍率，請調整手機與條碼的距離。'; }
};
$('startBtn').onclick = async () => {
  if (busy || running) return;
  scannerNotice('已按下啟動，正在檢查相機與辨識引擎…');
  void unlockSound();
  if (!hasLib()) return;
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    $('cameraError').textContent = '請以 Safari 或 Chrome 開啟本網站的 HTTPS 網址。'; return;
  }
  $('quickResult').hidden = true;
  setBusy(true); attempts = 0; lastDecodedAt = 0; lastDecodedRaw = ''; startedAt = Date.now(); lastStatusAt = 0;
  $('cameraError').textContent = '正在要求相機權限…'; $('scanDiagnostics').textContent = '正在啟動完整影像辨識';
  const cameraId = $('cameraSelect').value;
  const camera = cameraId ? {deviceId: {exact: cameraId}} : {facingMode: {ideal: 'environment'}};
  const onFrame = (result, error) => {
    attempts++; latestFrameAt = Date.now();
    if (result) showDecoded(result, '相機掃描');
    const now = Date.now();
    if (now - lastStatusAt > 1000) {
      lastStatusAt = now;
      const track = video.srcObject?.getVideoTracks()[0];
      $('scanDiagnostics').textContent = '辨識引擎 ZXing｜影像 ' + video.videoWidth + ' × ' + video.videoHeight + '｜已嘗試 ' + attempts + ' 次｜' + (track?.label || '相機');
      if (!lastDecodedAt && now - startedAt > 8000) {
        $('cameraError').textContent = '持續辨識中，尚未讀到條碼。請將條碼橫放並保留左右白邊；拉遠至影像清楚。若仍模糊，停止相機後切換後置鏡頭，或改用清晰照片辨識。';
      }
    }
    // NotFound, Checksum and Format errors are expected while searching.
    if (error && !['NotFoundException','ChecksumException','FormatException'].includes(decodeErrorKind(error))) {
      console.warn(error);
      $('cameraError').textContent = '辨識發生錯誤：' + (error.message || error.name) + '。請停止後重試，或改用照片辨識。';
    }
  };
  try {
    scanner = makeReader();
    try {
      controls = await scanner.decodeFromConstraints({audio: false, video: {...camera, width: {ideal: 1920}, height: {ideal: 1080}}}, video, onFrame);
    } catch (e) {
      if (e?.name !== 'OverconstrainedError') throw e;
      controls = await scanner.decodeFromConstraints({audio: false, video: camera}, video, onFrame);
    }
    running = true; latestFrameAt = Date.now(); startHeartbeat();
    await configureTrack(); await listCameras();
    if (!lastDecodedAt) $('cameraError').textContent = '掃描中，請對準條碼';
  } catch (e) {
    await stop();
    $('cameraError').textContent = '相機啟動失敗：' + (e?.message || String(e)) + '。請確認相機權限，或改用照片辨識。';
  } finally { setBusy(false); }
};
$('stopBtn').onclick = async () => { await stop(); $('cameraError').textContent = '相機已停止'; };
$('fileBtn').onclick = () => { if (!busy) { void unlockSound(); $('fileInput').click(); } };
// Decode original-size photos; rotate and retry to support portrait captures.
async function decodePhoto(file) {
  const url = URL.createObjectURL(file), image = new Image();
  try {
    image.src = url; await image.decode();
    const scale = Math.min(1, 2600 / Math.max(image.naturalWidth, image.naturalHeight));
    const w = Math.round(image.naturalWidth * scale), h = Math.round(image.naturalHeight * scale);
    const canvas = document.createElement('canvas'), reader = makeReader();
    for (const angle of [0, 90, 180, 270]) {
      canvas.width = angle % 180 ? h : w; canvas.height = angle % 180 ? w : h;
      const context = canvas.getContext('2d', {willReadFrequently: true});
      context.translate(canvas.width / 2, canvas.height / 2); context.rotate(angle * Math.PI / 180);
      context.drawImage(image, -w / 2, -h / 2, w, h);
      try { return reader.decodeFromCanvas(canvas); } catch (e) {
        if (!['NotFoundException','ChecksumException','FormatException'].includes(decodeErrorKind(e))) throw e;
      }
      await new Promise(resolve => setTimeout(resolve, 0));
    }
    throw new Error('找不到可辨識的一維條碼');
  } finally { URL.revokeObjectURL(url); }
}
$('fileInput').onchange = async e => {
  const file = e.target.files?.[0]; if (!file || busy || !hasLib()) return;
  await stop(); setBusy(true); $('cameraError').textContent = '正在辨識照片（含旋轉方向）…';
  try { showDecoded(await decodePhoto(file), '圖片檔案'); }
  catch (err) { $('cameraError').textContent = '照片未能解碼：' + (err?.message || String(err)) + '。請拍攝正面清晰近照，保留條碼左右白邊。'; }
  finally { e.target.value = ''; setBusy(false); }
};
// Pause on leaving the page so the camera is released on mobile.
document.addEventListener('visibilitychange', () => { if (document.hidden && running) void stop(); });

$('manualBtn').onclick=()=>{const raw=$('manual').value.trim();if(!raw){$('cameraError').textContent='請先輸入測試字串';return}present(raw,'手動輸入／未經條碼驗證','手動模擬')};
$('expected').oninput=()=>{if(last)present(last.raw,last.format,last.source)};
$('copyBtn').onclick=async()=>{if(!last)return;try{await navigator.clipboard.writeText(last.raw);$('cameraError').textContent='已複製原始內容'}catch{$('cameraError').textContent='無法複製，請長按選取原始內容'}};
$('saveBtn').onclick=()=>{if(!last)return;history.unshift({...last});persist();render();$('cameraError').textContent='已加入測試紀錄'};
function persist(){try{localStorage.setItem(LS,JSON.stringify(history))}catch{$('cameraError').textContent='瀏覽器儲存空間不足，請立即匯出紀錄。'}}
function render(){$('recordCount').textContent=String(history.length);const tbody=$('rows');tbody.replaceChildren();if(!history.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.textContent='尚無紀錄';tr.append(td);tbody.append(tr);return}history.forEach((r,i)=>{const tr=document.createElement('tr');[new Date(r.time).toLocaleString('zh-TW'),r.raw,r.format,r.expected,r.result].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});const td=document.createElement('td'),b=document.createElement('button');b.className='secondary';b.textContent='刪除';b.onclick=()=>{history.splice(i,1);persist();render()};td.append(b);tr.append(td);tbody.append(tr)})}
$('exportBtn').onclick=()=>{const columns=['time','raw','format','expected','result','source'];const safe=v=>{let s=String(v??'');if(/^[\s]*[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};const csv='\ufeff'+[['時間','條碼原始內容','辨識格式','標籤財產編號','比對結果','來源'].map(safe).join(','),...history.map(r=>columns.map(c=>safe(r[c])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='財產條碼測試_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};
$('clearBtn').onclick=()=>{if(!confirm('確定刪除這台裝置上所有測試紀錄？此操作無法復原。'))return;history=[];persist();render()};render();

$('cameraSelect').onchange = () => { try { localStorage.setItem('fdes_asset_camera_v01', $('cameraSelect').value); } catch {} };
$('recordsBtn').onclick = () => $('recordsDialog').showModal();
$('closeRecordsBtn').onclick = () => $('recordsDialog').close();
$('toolsBtn').onclick = () => $('toolsDialog').showModal();
$('closeToolsBtn').onclick = () => $('toolsDialog').close();
void listCameras();

window.scanAppReady = true;
window.updateLoadStatus?.();
})();
</script>
